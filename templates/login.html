<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
    body {
    background-color: #f0f2f5;
}

.login-box {
    width: 400px;
    margin: 100px auto;
    padding: 30px;

    background: white;

    border-radius: 10px;

    box-shadow: 0px 0px 10px gray;
}
</style>
</head>
<body>

<h2>Student Login</h2>

<form method="POST">

    <input type="email"
           name="email"
           placeholder="Enter Email"
           required><br><br>

    <input type="password"
           name="password"
           placeholder="Enter Password"
           required><br><br>

    <button type="submit">Login</button>

</form>

<a href="/register">Create Account</a>

</body>
</html>
